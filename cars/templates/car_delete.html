{% extends "base.html" %}

{% block title %}Deletar Veículo — Murilão Multimarcas{% endblock %}

{% block content %}
<style>
  .delete-wrapper {
    max-width: 480px;
    margin: 60px auto;
    text-align: center;
  }

  .delete-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background-color: rgba(192, 57, 43, 0.12);
    border: 1px solid rgba(192, 57, 43, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 22px;
  }

  .delete-wrapper h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 400;
    color: var(--text-primary);
    margin-bottom: 12px;
  }

  .delete-wrapper p {
    color: var(--text-secondary);
    font-size: 0.95rem;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .delete-wrapper p strong {
    color: var(--text-primary);
    font-weight: 500;
  }

  .delete-card {
    background-color: var(--dark-card);
    border: 1px solid rgba(192, 57, 43, 0.2);
    border-radius: 10px;
    padding: 28px;
  }

  .action-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
</style>

<div class="delete-wrapper">
  <div class="delete-icon">⚠</div>
  <h1>Confirmar exclusão</h1>
  <p>Você está prestes a remover <strong>{{ object.brand }} {{ object.model }}</strong> do estoque. Esta ação não pode ser desfeita.</p>

  <div class="delete-card">
    <form method="post">
      {% csrf_token %}
      <div class="action-buttons">
        <button type="submit" class="btn btn-danger">Confirmar exclusão</button>
        <a href="{% url 'car_update' pk=object.pk %}" class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
