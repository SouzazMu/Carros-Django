{% extends "base.html" %}

{% block title %}Cadastrar Carro — Murilão Multimarcas{% endblock %}

{% block content %}
<style>
  .form-container {
    max-width: 640px;
    margin: 0 auto;
  }

  .form-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 400;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .form-subtitle {
    color: var(--text-muted);
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    margin-bottom: 32px;
  }

  .form-card {
    background-color: var(--dark-card);
    border: 1px solid var(--dark-border);
    border-radius: 10px;
    padding: 32px;
  }

  .form-group {
    margin-bottom: 22px;
  }

  .form-group label {
    color: var(--text-muted);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
    display: block;
    margin-bottom: 8px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background-color: var(--dark-bg);
    border: 1px solid var(--dark-border);
    color: var(--text-primary);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 0.9rem;
    font-family: 'DM Sans', sans-serif;
    transition: border-color 0.2s;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--gold-dim);
  }

  .form-group select option { background-color: #1e1e1e; }

  .form-group textarea { resize: vertical; min-height: 100px; }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--dark-border);
  }

  ul.errorlist {
    color: #e57373;
    font-size: 0.8rem;
    list-style: none;
    margin-top: 6px;
  }

  /* Render Django table form nicely */
  table { width: 100%; border-collapse: collapse; }
  table tr th {
    color: var(--text-muted);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
    text-align: left;
    padding: 0 0 8px 0;
    width: 160px;
    vertical-align: top;
    padding-top: 12px;
  }
  table tr td { padding: 6px 0 16px 0; }
  table tr td input,
  table tr td select,
  table tr td textarea {
    width: 100%;
    max-width: 100%;
  }
</style>

<div class="form-container">
  <h1 class="form-title">Cadastrar Veículo</h1>
  <p class="form-subtitle">Preencha as informações do veículo abaixo</p>

  <div class="form-card">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <table>{{ form.as_table }}</table>
      <div class="form-actions">
        <button type="submit" class="btn btn-gold">Cadastrar</button>
        <a href="{% url 'cars_list' %}" class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
