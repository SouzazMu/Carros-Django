{% extends "base.html" %}

{% block title %}Editar {{ object.model }} — Murilão Multimarcas{% endblock %}

{% block content %}
<style>
  .form-container { max-width: 640px; margin: 0 auto; }

  .form-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 400;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .form-subtitle {
    color: var(--text-muted);
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    margin-bottom: 32px;
  }

  .form-card {
    background-color: var(--dark-card);
    border: 1px solid var(--dark-border);
    border-radius: 10px;
    padding: 32px;
  }

  table { width: 100%; border-collapse: collapse; }
  table tr th {
    color: var(--text-muted);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
    text-align: left;
    padding: 0 0 8px 0;
    width: 160px;
    vertical-align: top;
    padding-top: 12px;
  }
  table tr td { padding: 6px 0 16px 0; }
  table tr td input,
  table tr td select,
  table tr td textarea { width: 100%; max-width: 100%; }

  ul.errorlist {
    color: #e57373;
    font-size: 0.8rem;
    list-style: none;
    margin-top: 6px;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--dark-border);
  }
</style>

<div class="form-container">
  <h1 class="form-title">Editar Veículo</h1>
  <p class="form-subtitle">{{ object.brand }} {{ object.model }}</p>

  <div class="form-card">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <table>{{ form.as_table }}</table>
      <div class="form-actions">
        <button type="submit" class="btn btn-gold">Salvar Alterações</button>
        <a href="{% url 'car_detail' pk=object.pk %}" class="btn btn-outline">Cancelar</a>
        <a href="{% url 'car_delete' pk=object.pk %}" class="btn btn-danger">Deletar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
